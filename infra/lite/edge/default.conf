# The box's port 80. Only attendance machines are treated differently here:
#
#   - SecurEye-style machines (FK push) name their work in headers with
#     underscores (request_code, dev_id …). Caddy removes such headers, so
#     these calls go straight to the app (BiometricFkController).
#   - ADMS machines (/iclock/) go straight to the app too, as they did via Caddy.
#   - Everything else goes to Caddy, which redirects to https and answers
#     Let's Encrypt. Port 443 does not pass through here at all.
#
# Names are looked up per request, so this gate starts and keeps running
# while web or Caddy restart.

server {
    listen 80 default_server;
    server_name _;
    server_tokens off;

    underscores_in_headers on;
    client_max_body_size 16m;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $app web:80;
    set $caddy caddy:80;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto http;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;

    location / {
        error_page 418 = @fk_machine;
        if ($http_request_code != "") {
            return 418;
        }
        proxy_pass http://$caddy$request_uri;
    }

    location /iclock/ {
        proxy_pass http://$app$request_uri;
    }

    # The machine reads this answer's headers itself: nothing it did not ask for.
    location @fk_machine {
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Cache-Control;
        proxy_pass http://$app/fkweb;
    }
}

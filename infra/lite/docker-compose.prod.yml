# SuperLMS — "lite" single-box production stack (Phase LITE).
#
# One EC2 box runs EVERYTHING: Caddy (auto-HTTPS) -> web (nginx+php-fpm),
# a queue worker, a scheduler, MySQL 8 and Redis 7 — all as containers.
# This replaces the whole Fargate + ALB + RDS + ElastiCache stack and brings
# the bill from ~$150/mo down to ~$30-35/mo.
#
# Sized for a t4g.medium (4 GB / 2 vCPU) handling ~4-5k students. mem_limits
# are CEILINGS (not reservations); real steady-state is well under 4 GB, and
# setup-ec2.sh adds a 4 GB swap file as a safety net.
#
# Usage on the box:
#   cd /opt/superlms/infra/lite
#   docker compose -f docker-compose.prod.yml --env-file .env up -d --build
#
# The image is built ON the box from the repo (native arm64), so no ECR needed.

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

# Every container that runs the app image shares this base.
x-app: &app-base
  build:
    context: ../..
    dockerfile: Dockerfile
    target: runtime
  image: superlms/app:prod
  restart: unless-stopped
  logging: *default-logging
  env_file:
    - .env
  environment:
    DB_HOST: mysql
    DB_PORT: "3306"
    REDIS_HOST: redis
    REDIS_PORT: "6379"
  # Persist only Laravel's writable storage (logs, framework cache, local tmp).
  # Source + vendor + built assets all live INSIDE the image — no host bind
  # mounts of the code, unlike the dev compose.
  volumes:
    - app-storage:/var/www/html/storage
  # Trim php-fpm's pool for a 4 GB box (image default is max_children=20).
  configs:
    - source: php_fpm_pool
      target: /usr/local/etc/php-fpm.d/www.conf
  depends_on:
    mysql:
      condition: service_healthy
    redis:
      condition: service_started
  networks:
    - superlms

services:
  # ── Caddy: public entrypoint, terminates TLS (Let's Encrypt, free) ─────────
  # Replaces the ALB + ACM cert. Auto-renews certs. school custom domains can
  # be added later via on-demand TLS (see Caddyfile).
  caddy:
    image: caddy:2-alpine
    container_name: superlms-caddy
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-superlms.in}
      TLS_EMAIL: ${TLS_EMAIL:-admin@superlms.in}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - web
    networks:
      - superlms
    mem_limit: 128m

  # ── WEB: nginx + php-fpm (image default CMD) ───────────────────────────────
  web:
    <<: *app-base
    container_name: superlms-web
    # No host port — only Caddy reaches it, over the internal network on :80.
    expose:
      - "80"
    mem_limit: 1200m

  # ── WORKER: queue worker (emails, notifications, exports, etc.) ────────────
  worker:
    <<: *app-base
    container_name: superlms-worker
    command: php artisan queue:work --tries=3 --timeout=120 --sleep=3 --max-jobs=1000 --max-time=3600
    mem_limit: 384m

  # ── SCHEDULER: exactly ONE instance (Laravel cron) ────────────────────────
  scheduler:
    <<: *app-base
    container_name: superlms-scheduler
    command: php artisan schedule:work
    mem_limit: 256m

  # ── MySQL 8 (self-managed, replaces RDS) ──────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: superlms-mysql
    restart: unless-stopped
    logging: *default-logging
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-superlms}
      MYSQL_USER: ${DB_USERNAME:-superlms}
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in .env}
    command:
      - --default-authentication-plugin=caching_sha2_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
      - ./config/mysql-tuning.cnf:/etc/mysql/conf.d/zz-tuning.cnf:ro
    # NOT published to the host — reachable only from the app containers.
    expose:
      - "3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - superlms
    mem_limit: 1500m

  # ── Redis 7 (self-managed, replaces ElastiCache) ──────────────────────────
  # Holds cache + sessions + queue. appendonly on so queued jobs survive a
  # restart; noeviction so the queue is never silently dropped.
  redis:
    image: redis:7-alpine
    container_name: superlms-redis
    restart: unless-stopped
    logging: *default-logging
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    volumes:
      - redis-data:/data
      - ./config/redis.conf:/usr/local/etc/redis/redis.conf:ro
    expose:
      - "6379"
    networks:
      - superlms
    mem_limit: 512m

configs:
  php_fpm_pool:
    file: ./config/php-fpm-pool.conf

volumes:
  mysql-data:
  redis-data:
  app-storage:
  caddy-data:
  caddy-config:

networks:
  superlms:
    driver: bridge

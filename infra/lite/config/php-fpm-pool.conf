; php-fpm pool tuned for the lite single-box (4 GB, shared with MySQL+Redis).
; Overrides the image's default pool (which uses max_children=20 — too many
; for a 4 GB box once MySQL takes ~1.3 GB and Redis ~0.4 GB).
;
; Each PHP worker for this app is ~60-90 MB, so 8 children ~= up to ~720 MB.
; That comfortably serves a few hundred concurrent users (4-5k students, of
; whom only a fraction are active at once). Raise max_children if you move to
; a bigger box.
[www]
user = www-data
group = www-data
listen = 127.0.0.1:9000

pm = dynamic
pm.max_children = 8
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 500

clear_env = no
catch_workers_output = yes
decorate_workers_output = no

access.log = /proc/self/fd/2
php_admin_value[error_log] = /proc/self/fd/2
php_admin_flag[log_errors] = on

request_terminate_timeout = 120s
security.limit_extensions = .php

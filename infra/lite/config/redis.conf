# Redis for the lite single-box. Holds cache + sessions + queue.
#
# noeviction: queued jobs and sessions are NEVER silently dropped when memory
# fills — instead a write fails loudly (rare at this scale). Do not switch to
# an allkeys-* policy or the queue could lose jobs.
maxmemory 384mb
maxmemory-policy noeviction

# Durability: append-only file so the queue survives a container restart.
appendonly yes
appendfsync everysec

# Reasonable defaults.
save 900 1
save 300 10
tcp-keepalive 60

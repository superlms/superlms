name: Deploy

# PRs + pushes run `validate` (fast, no secrets, no infra).
# Only pushes to main, with `validate` green, proceed to `deploy`, which SSHes
# into the single-box (infra/lite / Docker Compose) and runs a pull-based deploy
# (git pull -> build image -> migrate -> restart the stack). The old ECS/ECR/OIDC
# path is gone (that account was decommissioned in the lite migration).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ──────────────────────────────────────────────────────────────────────
  # JOB 1 — VALIDATE  (catches deploy-blocking bugs before we build/ship)
  # ──────────────────────────────────────────────────────────────────────
  validate:
    name: Validate (autoload, routes, views, migrations, assets)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootsecret
          MYSQL_DATABASE: lms_superlms
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -prootsecret"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: bcmath, exif, gd, intl, mbstring, pdo_mysql, redis, zip, pcntl
          tools: composer:v2
          coverage: none

      - name: Setup Node 20 (matches Dockerfile assets stage)
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: PHP syntax lint (php -l)
        run: |
          set -e
          find app bootstrap config database routes tests -name '*.php' -print0 \
            | xargs -0 -n1 -P4 php -l > /tmp/lint.log 2>&1 \
            || (grep -v 'No syntax errors' /tmp/lint.log; exit 1)
          echo "All PHP files lint clean."

      - name: Guard against PHP files without class declarations
        run: |
          set -e
          missing=$(
            find app -type f -name '*.php' -print0 \
              | xargs -0 -I{} sh -c '
                  if ! grep -qE "^\s*(class|interface|trait|enum|abstract class|final class)\s" "$1"; then
                    echo "$1"
                  fi
                ' _ {}
          )
          if [ -n "$missing" ]; then
            echo "::error::These files under app/ have no class/interface/trait/enum declaration:"
            echo "$missing"
            exit 1
          fi
          echo "All files under app/ declare a class-like symbol."

      - name: Composer install (no-dev, prod-like)
        run: |
          composer install --no-dev --no-interaction --no-progress \
            --prefer-dist --optimize-autoloader --no-scripts

      - name: Strict PSR-4 + classmap-authoritative (mirrors Dockerfile)
        run: |
          composer dump-autoload --optimize --classmap-authoritative --strict-psr --no-scripts

      - name: Build front-end assets (npm ci + vite build)
        run: |
          npm ci
          npm run build
          test -f public/build/manifest.json
          echo "Vite manifest produced."

      - name: Prepare .env for CI run
        run: |
          cp .env.example .env
          sed -i 's/^DB_HOST=.*/DB_HOST=127.0.0.1/' .env
          sed -i 's/^DB_PORT=.*/DB_PORT=3306/' .env
          sed -i 's/^DB_DATABASE=.*/DB_DATABASE=lms_superlms/' .env
          sed -i 's/^DB_USERNAME=.*/DB_USERNAME=root/' .env
          sed -i 's/^DB_PASSWORD=.*/DB_PASSWORD=rootsecret/' .env
          sed -i 's/^CACHE_STORE=.*/CACHE_STORE=file/' .env
          sed -i 's/^SESSION_DRIVER=.*/SESSION_DRIVER=file/' .env
          sed -i 's/^QUEUE_CONNECTION=.*/QUEUE_CONNECTION=sync/' .env
          php artisan key:generate --force --no-interaction

      - name: artisan config:cache (catches env() usage outside config files)
        run: php artisan config:cache
      - name: artisan view:cache (catches Blade compile errors)
        run: php artisan view:cache
      - name: artisan migrate (real MySQL)
        run: php artisan migrate --force --no-interaction
      - name: artisan lms:migrate (schema-drift command)
        run: php artisan lms:migrate --no-interaction
      - name: artisan route:list (catches invalid route actions)
        run: |
          php artisan route:list --no-ansi >/dev/null
          echo "All routes resolved."

  # ──────────────────────────────────────────────────────────────────────
  # JOB 2 — DEPLOY  (single-box / infra/lite: SSH -> git pull -> deploy.sh)
  # No AWS creds needed. Requires two repo secrets:
  #   DEPLOY_HOST     — the box's Elastic IP (or a DNS name that resolves to it)
  #   DEPLOY_SSH_KEY  — the PRIVATE key (contents of infra/lite/superlms-key.pem)
  # The box already has the repo cloned at /opt/superlms and infra/lite/.env set.
  # deploy.sh builds the image, runs migrations once, and (re)starts the stack.
  # ──────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to single-box (SSH + Docker Compose)
    needs: validate
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - name: Deploy over SSH (git pull + build + migrate + restart)
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${DEPLOY_HOST:-}" ] || [ -z "${DEPLOY_SSH_KEY:-}" ]; then
            echo "::error::DEPLOY_HOST and DEPLOY_SSH_KEY repo secrets must be set."
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes ec2-user@"$DEPLOY_HOST" bash -se <<'REMOTE'
            set -euo pipefail
            cd /opt/superlms
            git fetch --prune origin main
            git reset --hard origin/main
            cd infra/lite
            ./deploy.sh
          REMOTE
